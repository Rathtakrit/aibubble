<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · The Ledger (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Public+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5EFE3}
a{color:#1E3A8A}a:hover{color:#142A66}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F5EFE3; color: #1B1A17; font-family: 'Public Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45;">

<header style="display: flex; justify-content: space-between; align-items: center; padding: 8px 8px 8px 16px; border-bottom: 1px solid #1B1A17;">
<a href="#top" style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: #1B1A17; text-decoration: none;">The AI Bubble</a>
<button type="button" aria-label="Menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #1B1A17; cursor: pointer;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</header>
<div style="display: flex; justify-content: space-between; padding: 6px 16px; border-bottom: 3px double #1B1A17; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #57534B;">
<span>Explore</span>
<span>All AI · [total value]</span>
</div>

<div style="padding: 10px 12px 0;">
<dc-import name="Bubble" focus="openai" show-links="{{yes}}" label-scale="{{scale}}" accent="{{accent}}" ink="#1B1A17" ink2="#57534B" paper="#F5EFE3" muted="#ECE4D5" font="'Public Sans', system-ui, sans-serif" hint-size="366px,366px"></dc-import>
</div>

<section aria-label="Selected company" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F5EFE3; border-top: 1px solid #1B1A17; box-shadow: 0 -10px 24px rgba(27, 26, 23, 0.08); padding: 8px 16px 18px;">
<div style="width: 36px; height: 4px; border-radius: 2px; background: #CFC5B2; margin: 0 auto 10px;"></div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;">
<div>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}};">Private lab</span>
<h2 style="margin: 2px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1;">OpenAI</h2>
</div>
<div style="text-align: right;">
<span style="display: block; font-size: 11px; color: #57534B;">Value on [date]</span>
<strong style="font-weight: 600; font-size: 17px;">[value]</strong>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; padding-top: 10px; border-top: 1px solid #CFC5B2; font-size: 13px;">
<div>
<span style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #57534B;">Money in</span>
<span>Microsoft, Nvidia</span>
</div>
<div>
<span style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #57534B;">Money out</span>
<span>Oracle, AMD</span>
</div>
</div>
<a href="#news" style="display: flex; align-items: center; min-height: 44px; margin-top: 6px; font-size: 14px; font-weight: 600; text-decoration: none; color: {{accent}};">Deals and news on this date →</a>

<div style="margin-top: 8px; padding-top: 12px; border-top: 1px solid #CFC5B2;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #57534B;">Timeline</span>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 20px;">[selected date]</span>
</div>
<div style="position: relative; height: 56px;">
<div style="position: absolute; left: 0; right: 0; top: 22px; border-top: 1px solid #1B1A17;"></div>
<div style="position: absolute; left: 0; width: 72%; top: 21px; border-top: 3px solid {{accent}};"></div>
<span style="position: absolute; left: 0%; top: 18px; width: 9px; height: 9px; box-sizing: border-box; border-radius: 50%; background: #F5EFE3; border: 1.5px solid #1B1A17;"></span>
<span style="position: absolute; left: 58%; top: 18px; width: 9px; height: 9px; box-sizing: border-box; border-radius: 50%; background: #F5EFE3; border: 1.5px solid #1B1A17; transform: translateX(-50%);"></span>
<span style="position: absolute; left: 81%; top: 18px; width: 9px; height: 9px; box-sizing: border-box; border-radius: 50%; background: #F5EFE3; border: 1.5px solid #1B1A17; transform: translateX(-50%);"></span>
<button type="button" aria-label="Timeline handle, drag to change the date" style="position: absolute; left: 72%; top: 9px; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 3px solid #F5EFE3; background: {{accent}}; box-shadow: 0 0 0 1px {{accent}}; transform: translateX(-50%); cursor: grab;"></button>
<span style="position: absolute; left: 0; top: 38px; font-size: 11px; color: #57534B;">Jun 2017</span>
<span style="position: absolute; left: 58%; top: 38px; transform: translateX(-50%); font-size: 11px; color: #57534B;">ChatGPT</span>
<span style="position: absolute; right: 0; top: 38px; font-size: 11px; color: #57534B;">Today</span>
</div>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E3A8A","options":["#1E3A8A","#1D4ED8","#173F5F","#2B3A67"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#1E3A8A',
      yes: true,
      scale: 0.62
    };
  }
}
</script>
</body>
</html>
