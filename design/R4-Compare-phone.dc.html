<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Instrument+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A8A}a:hover{color:#1B1A17}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5EFE3; color: #1B1A17; font-family: 'Instrument Sans', sans-serif; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-family: 'Instrument Serif', serif; font-size: 26px; font-style: italic">Bubble</span>
    <div role="group" aria-label="Measure" style="display: flex; border: 1px solid #1B1A17; border-radius: 999px; padding: 2px">
      <button style="min-height: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: #1B1A17; color: #F5EFE3; font: 600 13px 'Instrument Sans', sans-serif">Size</button>
      <button style="min-height: 44px; padding: 0 10px; border: 0; background: transparent; color: #1B1A17; font: 500 13px 'Instrument Sans', sans-serif">Change</button>
      <button style="min-height: 44px; padding: 0 10px; border: 0; background: transparent; color: #1B1A17; font: 500 13px 'Instrument Sans', sans-serif">Growth</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button style="min-height: 52px; border: 0; border-top: 4px solid #1E3A8A; background: #FBF7EF; text-align: left; padding: 6px 10px; font: 500 14px 'Instrument Sans', sans-serif; color: #1B1A17; display: flex; flex-direction: column; justify-content: center">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #1E3A8A">A ▾</span>AI · lowest</button>
    <button style="min-height: 52px; border: 0; border-top: 4px solid #C2410C; background: #FBF7EF; text-align: left; padding: 6px 10px; font: 500 14px 'Instrument Sans', sans-serif; color: #1B1A17; display: flex; flex-direction: column; justify-content: center">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #9A3412">B ▾</span>Dot-com · peak</button>
  </div>

  <div style="display: flex; justify-content: center">
    <svg width="358" height="330" viewBox="0 0 620 500" role="img" aria-label="Two translucent circles on one scale, A in blue and B in orange, laid over each other">
      <g style="mix-blend-mode: multiply">
        <circle cx="300" cy="260" r="225" fill="#1E3A8A" fill-opacity="0.13" stroke="#1E3A8A" stroke-width="3"></circle>
        <circle cx="215" cy="190" r="62" fill="#1E3A8A" fill-opacity="0.10" stroke="#1E3A8A" stroke-opacity="0.5"></circle>
        <circle cx="355" cy="170" r="70" fill="#1E3A8A" fill-opacity="0.10" stroke="#1E3A8A" stroke-opacity="0.5"></circle>
        <circle cx="390" cy="320" r="52" fill="#1E3A8A" fill-opacity="0.10" stroke="#1E3A8A" stroke-opacity="0.5"></circle>
      </g>
      <g style="mix-blend-mode: multiply">
        <circle cx="300" cy="345" r="140" fill="#C2410C" fill-opacity="0.16" stroke="#C2410C" stroke-width="3"></circle>
        <circle cx="255" cy="310" r="40" fill="#C2410C" fill-opacity="0.12" stroke="#C2410C" stroke-opacity="0.55"></circle>
        <circle cx="340" cy="300" r="34" fill="#C2410C" fill-opacity="0.12" stroke="#C2410C" stroke-opacity="0.55"></circle>
        <circle cx="290" cy="395" r="36" fill="#C2410C" fill-opacity="0.12" stroke="#C2410C" stroke-opacity="0.55"></circle>
      </g>
    </svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div><span style="font-family: 'Instrument Serif', serif; font-size: 28px; color: #1E3A8A">[$X.XT]</span><br><span style="font-size: 12px; color: #57534B">A · [date]</span></div>
    <div><span style="font-family: 'Instrument Serif', serif; font-size: 28px; color: #9A3412">[$X.XT]</span><br><span style="font-size: 12px; color: #57534B">B · [date]</span></div>
  </div>

  <p style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 26px; border-top: 1px solid #1B1A17; padding-top: 10px">A is <span style="color: #1E3A8A">[N]%</span> bigger than B</p>

  <div style="display: flex; gap: 8px; overflow: hidden">
    <button style="min-height: 44px; padding: 0 12px; border: 1px solid #CFC5B2; border-radius: 999px; background: #FBF7EF; font: 500 13px 'Instrument Sans', sans-serif; color: #1B1A17; white-space: nowrap">Peaks side by side</button>
    <button style="min-height: 44px; padding: 0 12px; border: 1px solid #CFC5B2; border-radius: 999px; background: #FBF7EF; font: 500 13px 'Instrument Sans', sans-serif; color: #1B1A17; white-space: nowrap">Biggest company</button>
  </div>

  <div style="margin-top: auto; display: flex; gap: 8px">
    <button style="flex: 1; min-height: 44px; border: 1px solid #1B1A17; border-radius: 999px; background: transparent; font: 500 14px 'Instrument Sans', sans-serif; color: #1B1A17">Swap</button>
    <button style="flex: 1; min-height: 44px; border: 1px solid #1B1A17; border-radius: 999px; background: transparent; font: 500 14px 'Instrument Sans', sans-serif; color: #1B1A17">Players ▾</button>
    <button style="flex: 1; min-height: 44px; border: 1px solid #1B1A17; border-radius: 999px; background: transparent; font: 500 14px 'Instrument Sans', sans-serif; color: #1B1A17">Sources</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
