# Build and checks for every pull request.
# The night shift also starts this by hand after each run, because PRs opened with
# GitHub's built-in token don't trigger workflows on their own.
name: check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # Reports the result where you'll see it, and sets night PRs to draft (failed) or ready (passed).
  report:
    name: report result
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RESULT: ${{ needs.check.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Runs started by the night shift don't appear in a PR's checks list,
      # so put the result on the commit itself, where the PR does show it.
      - name: Show the result on the PR
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$RESULT" = success ]; then state=success; text="Build and checks passed"
          else state=failure; text="Build and checks failed"; fi
          gh api "repos/$GH_REPO/statuses/$SHA" -f state="$state" -f context="check / build and check" \
            -f description="$text" -f target_url="$RUN_URL" --silent
      - name: Set draft or ready
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --label night --json number,isDraft --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "Not a night PR. Nothing to do."; exit 0; fi
          num=$(jq -r .number <<<"$pr")
          draft=$(jq -r .isDraft <<<"$pr")
          if [ "$RESULT" = success ]; then
            if [ "$draft" = true ]; then gh pr ready "$num"; fi
            echo "PR #$num passed its checks."
          elif [ "$draft" = false ]; then
            gh pr ready "$num" --undo
            gh pr comment "$num" --body "The build and checks failed, so this PR is now a draft. Log: $RUN_URL"
          fi
