name: news

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Day to draft news for (YYYY-MM-DD, defaults to yesterday in UTC)"
        required: false
        type: string
  # The owner adds a schedule line here (for example:
  # schedule: with cron: "0 5 * * *") after the first good test run.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the day
        id: day
        env:
          NEWS_DAY: ${{ inputs.day }}
        run: echo "day=${NEWS_DAY:-$(date -u -d yesterday +%F)}" >> "$GITHUB_OUTPUT"

      - name: Reuse or start the news-drafts branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --head news-drafts --state open --json number --jq length)
          if [ "$open" -gt 0 ]; then
            git switch news-drafts
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            git switch -c news-drafts origin/main
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Run the news job
        run: node scripts/news-job.mjs
        env:
          NEWS_DAY: ${{ inputs.day }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_KEY: ${{ secrets.AIBUBBLE_GATEWAY_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - run: npm run check:data

      - name: Did data/news.json change
        id: drafts
        run: |
          if [ -n "$(git status --porcelain data/news.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the drafts
        if: steps.drafts.outputs.changed == 'true'
        env:
          DAY: ${{ steps.day.outputs.day }}
          FRESH: ${{ steps.branch.outputs.fresh }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "News drafts for $DAY"
          if [ "$FRESH" = "true" ]; then
            git push --force-with-lease origin news-drafts
          else
            git push origin news-drafts
          fi

      - name: Open the pull request
        if: steps.drafts.outputs.changed == 'true' && steps.branch.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.day.outputs.day }}
        run: |
          gh pr create --base main --head news-drafts \
            --title "News drafts, week of $DAY" \
            --body "These items were drafted by AI from news feeds. Delete the ones you do not want, correct the rest, and nothing is on the site until you merge."
